name: Build and Deploy Trading Bot

on:
  push:
    branches:
      - master   # or your target branch
  workflow_dispatch:

env:
  STRADDLE_IMAGE_NAME: nifty-straddle:${{ github.run_number }}   # Change as needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test paper iron fly
        run: |
          python -m pip install -r straddle/requirements.txt
          python test_ironfly.py

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      - name: Login to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          
      - name: Build Docker image
        run: |
          docker build -f straddle/Dockerfile -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }} .
      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }}

      - name: Deploy to Nifty Straddle Job
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az containerapp job update \
              --name ${{ secrets.NIFTY_STRADDLE_JOB_NAME }} \
              --resource-group ${{ secrets.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.STRADDLE_IMAGE_NAME }} \
              --set-env-vars live_trading=false

      - name: Restart running Nifty Straddle jobs
        uses: azure/CLI@v1
        with:
          inlineScript: |
            running_jobs=$(az containerapp job execution list --name ${{ secrets.NIFTY_STRADDLE_JOB_NAME }} --resource-group ${{ secrets.RESOURCE_GROUP }} --query "[?properties.status=='Running']")
            if [ "$running_jobs" != "[]" ]; then
              az containerapp job stop -n ${{ secrets.NIFTY_STRADDLE_JOB_NAME }} -g ${{ secrets.RESOURCE_GROUP }}
              az containerapp job start -n ${{ secrets.NIFTY_STRADDLE_JOB_NAME }} -g ${{ secrets.RESOURCE_GROUP }}
            fi
